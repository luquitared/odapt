<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your order · {{NAME}}</title>
<style>
:root { --bg: #f4f5f7; --ink: #111317; --muted: #5b6370; --accent: #e8590c; }
@media (prefers-color-scheme: dark) { :root { --bg: #15171b; --ink: #eceef1; --muted: #98a0ab; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
.muted { color: var(--muted); }
a.btn, button { display: inline-block; font: 700 16px system-ui; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">Loading…</h1>
  <p id="body" class="muted"></p>
  <p id="action"></p>
</main>
<script>
const BASE = "{{BASE}}";
const id = location.pathname.split("/").pop();
const $ = (s) => document.querySelector(s);
async function tick() {
  const r = await fetch(`${BASE}/api/orders/${id}`);
  if (r.status === 404) { $("#title").textContent = "No such order"; return; }
  const o = await r.json();
  if (o.status === "unpaid") {
    $("#title").textContent = "Almost there";
    $("#body").textContent = "We start as soon as the payment goes through.";
    $("#action").innerHTML = "";
  } else if (o.status === "done") {
    $("#title").textContent = "Done";
    $("#body").textContent = o.text || "";
    $("#action").innerHTML = o.file ? `<a class="btn" href="${o.file}" download>Download</a>` : "";
    return;
  } else if (o.status === "failed") {
    $("#title").textContent = "That didn't work";
    $("#body").textContent = (o.error || "") + " You've been refunded.";
    return;
  } else {
    $("#title").textContent = "Working on it";
    $("#body").textContent = "This page updates on its own.";
  }
  setTimeout(tick, 3000);
}
tick();
</script>
</body>
</html>
