<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f0e3; --card: #fffaf1; --ink: #1d2742; --muted: #6b6f80; --line: #e4d8c3;
    --stamp: #d0402f; --sea: #17806f; --gold: #e2a21f; --sky: #3a6fd8;
    --shadow: 0 1px 0 rgba(29,39,66,.06), 0 10px 30px -12px rgba(29,39,66,.25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #111726; --card: #1a2236; --ink: #f1e9d8; --muted: #9aa0b4; --line: #2b3550;
      --stamp: #ff6a55; --sea: #3cc2a8; --gold: #f2bd45; --sky: #7aa2ff;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Instrument Sans", system-ui, sans-serif; }
  body { padding: 14px 14px 22px; }
  .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 14px; }
  .display { font-family: "Fraunces", Georgia, serif; font-weight: 800; letter-spacing: -.01em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .city { font-size: 22px; line-height: 1.1; margin-right: auto; }
  .city small { display: block; font: 500 12px "Instrument Sans", sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .chip.pop { animation: pop .5s ease; }
  .combo { color: var(--stamp); }
  .combo[hidden] { display: none; }
  .rank { display: grid; gap: 4px; min-width: 150px; flex: 1 1 150px; max-width: 220px; }
  .rank b { font-size: 13px; }
  .rank span { font-size: 12px; color: var(--muted); font-weight: 500; }
  .meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--stamp)); border-radius: 99px; transition: width .9s cubic-bezier(.2,.8,.2,1); }

  /* route */
  .route { position: relative; display: flex; justify-content: space-between; padding: 6px 4px 0; }
  .route::before { content: ""; position: absolute; left: 26px; right: 26px; top: 29px; border-top: 2px dashed var(--line); }
  .stop { position: relative; display: grid; justify-items: center; gap: 4px; width: 20%; text-align: center; }
  .dot { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--card); border: 2px solid var(--line); transition: transform .3s; }
  .stop.done .dot { border-color: var(--sea); }
  .stop.now .dot { border-color: var(--stamp); transform: scale(1.12); animation: pulse 1.8s infinite; }
  .stop .name { font-size: 11px; color: var(--muted); line-height: 1.2; max-width: 92px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .stop.now .name { color: var(--ink); font-weight: 700; }
  .stop .st { font-size: 11px; letter-spacing: 1px; color: var(--gold); min-height: 14px; }

  /* postcard */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
  .postcard { position: relative; overflow: hidden; padding: 18px; display: grid; gap: 14px; }
  .postcard.enter { animation: slide .55s cubic-bezier(.2,.8,.2,1); }
  .postcard::after { content: ""; position: absolute; inset: 7px; border: 1.5px dashed var(--line); border-radius: 13px; pointer-events: none; }
  .where { display: flex; align-items: center; gap: 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
  .where .bolt { margin-left: auto; color: var(--gold); }
  .who { display: flex; gap: 14px; align-items: flex-start; }
  .avatar { flex: none; width: 84px; height: 84px; border-radius: 22px; display: grid; place-items: center; font-size: 52px; background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--gold) 35%, transparent), transparent 70%), var(--paper); border: 1px solid var(--line); animation: bob 3.2s ease-in-out infinite; }
  .who h2 { margin: 2px 0 2px; font-size: 26px; line-height: 1.05; }
  .who .role { color: var(--muted); font-size: 14px; }
  .mood { display: inline-block; margin-top: 6px; font-size: 12px; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--stamp) 12%, transparent); color: var(--stamp); font-weight: 700; }
  .bubble { position: relative; background: var(--ink); color: var(--paper); border-radius: 18px; padding: 16px 18px; border: 0; text-align: left; width: 100%; }
  .bubble::before { content: ""; position: absolute; top: -9px; left: 34px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
  .bubble .line { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(22px, 5.4vw, 32px); line-height: 1.15; }
  .bubble .gloss { margin-top: 8px; font-size: 14px; opacity: .65; }
  .bubble .gloss.hide { filter: blur(5px); user-select: none; }
  .bubble small { display: block; margin-top: 6px; font-size: 11px; opacity: .5; text-transform: uppercase; letter-spacing: .08em; }

  /* mission */
  .ticket { display: grid; grid-template-columns: auto 1fr; gap: 0; overflow: hidden; }
  .ticket .side { writing-mode: vertical-rl; transform: rotate(180deg); padding: 12px 8px; background: var(--stamp); color: #fff; font-weight: 800; letter-spacing: .2em; font-size: 12px; text-align: center; }
  .ticket ul { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 8px; }
  .ticket li { display: flex; gap: 10px; align-items: baseline; }
  .ticket li .s { color: var(--gold); font-size: 18px; line-height: 1; width: 20px; flex: none; }
  .ticket li.main { font-weight: 700; font-size: 17px; }
  .ticket li.bonus { color: var(--muted); }
  .ticket li.bonus em { font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--sea); font-weight: 700; margin-right: 4px; }
  .hintline { margin: 0 14px 12px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--gold) 18%, transparent); font-weight: 500; }

  /* phrase kit */
  .kit h3, .bank h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .phrases { display: flex; flex-wrap: wrap; gap: 8px; }
  .phrase { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 12px; text-align: left; transition: transform .15s; }
  .phrase:hover { transform: translateY(-1px); }
  .phrase b { display: block; font-weight: 700; }
  .phrase span { font-size: 12px; color: var(--muted); }
  .phrase.locked b, .phrase.locked span { filter: blur(5px); }
  .phrase.locked::after { content: "tap to peek"; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--sky); margin-top: 2px; font-weight: 700; }

  /* controls */
  .controls { display: grid; gap: 10px; }
  .say { display: flex; gap: 8px; }
  .say input { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
  .btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; background: var(--card); border: 1.5px solid var(--line); }
  .btn.go { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row .tip { margin-left: auto; font-size: 13px; color: var(--muted); }
  .bulbs { letter-spacing: 2px; }

  /* result */
  .result { position: relative; padding: 16px 16px 16px 128px; min-height: 124px; overflow: hidden; }
  .result.play { animation: rise .45s ease; }
  .stampmark { position: absolute; left: 14px; top: 14px; width: 100px; height: 100px; border-radius: 50%; border: 4px double var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; transform: rotate(-12deg); }
  .result.play .stampmark { animation: slam .55s cubic-bezier(.3,1.6,.5,1) both; }
  .stampmark .n { font-family: "Fraunces", serif; font-weight: 800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; line-height: 1.1; }
  .stampmark .stars { font-size: 20px; letter-spacing: 1px; }
  .result h3 { margin: 0 0 4px; font-size: 18px; }
  .result p { margin: 0 0 8px; color: var(--muted); }
  .fix { display: grid; gap: 2px; padding: 8px 10px; border-left: 3px solid var(--gold); background: color-mix(in srgb, var(--gold) 8%, transparent); border-radius: 0 10px 10px 0; margin-top: 6px; }
  .fix s { color: var(--muted); }
  .fix b { color: var(--sea); }
  .fix span { font-size: 12px; color: var(--muted); }
  .clean { color: var(--sea); font-weight: 700; }

  /* bank */
  .bank { padding: 14px 16px; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .word { padding: 5px 10px; border-radius: 99px; background: var(--paper); border: 1px solid var(--line); font-size: 13px; }
  .word.new { animation: pop .6s ease; border-color: var(--sea); }
  .word i { font-style: normal; color: var(--muted); }

  /* passport */
  .passport { padding: 22px 18px; text-align: center; display: grid; gap: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--sea) 14%, var(--card)), var(--card)); }
  .passport h2 { margin: 0; font-size: 34px; line-height: 1; }
  .passport .big { font-size: 18px; }
  .stamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
  .pstamp { border: 3px double var(--stamp); color: var(--stamp); border-radius: 14px; padding: 10px 6px; display: grid; gap: 2px; font-weight: 700; font-size: 12px; animation: slam .5s cubic-bezier(.3,1.6,.5,1) both; }
  .pstamp:nth-child(odd) { transform: rotate(-4deg); border-color: var(--sea); color: var(--sea); }
  .pstamp:nth-child(even) { transform: rotate(3deg); }
  .pstamp .ic { font-size: 26px; }
  .review { text-align: left; }
  .review h3 { margin: 6px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }

  .waiting { padding: 40px 18px; text-align: center; color: var(--muted); }
  .waiting .display { font-size: 26px; color: var(--ink); }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }

  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stamp) 45%, transparent); } 50% { box-shadow: 0 0 0 9px transparent; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4px) rotate(2deg); } }
  @keyframes slide { from { opacity: 0; transform: translateX(40px) rotate(2deg); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes slam { 0% { opacity: 0; transform: scale(2.4) rotate(-30deg); } 100% { opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  @keyframes fall { to { transform: translateY(900px) rotate(540deg); opacity: 0; } }
  @media (max-width: 480px) {
    .result { padding: 14px 14px 14px 96px; min-height: 96px; }
    .stampmark { width: 72px; height: 72px; left: 12px; top: 12px; border-width: 3px; }
    .stampmark .n { font-size: 10px; }
    .stampmark .stars { font-size: 15px; }
    .stop .name { font-size: 10px; }
    .dot { width: 40px; height: 40px; font-size: 19px; }
    .route::before { top: 26px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card waiting"><div class="display">Packing your bags…</div><p>Your trip is being planned.</p></div></div>
<div class="confetti" id="confetti"></div>
<script>
const RANKS = [[0, "Tourist"], [4, "Explorer"], [7, "Traveler"], [10, "Regular"], [13, "Local"]];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const stars = (n, of = 3) => "★".repeat(n) + "☆".repeat(Math.max(0, of - n));
const app = document.getElementById("app");
const peeked = new Set(); // phrase kit cards opened, per scene
let prev = null, glossOpen = false, muted = false, ctx = null;

function score(s) {
  const done = (s.trip ?? []).filter((t) => t.done);
  const total = done.reduce((a, t) => a + (t.stars || 0), 0);
  let combo = 0;
  for (const t of [...done].reverse()) { if (t.stars === 3) combo++; else break; }
  let i = 0;
  while (i + 1 < RANKS.length && total >= RANKS[i + 1][0]) i++;
  const [lo, name] = RANKS[i], next = RANKS[i + 1];
  return { total, combo, rank: name, next: next?.[1], pct: next ? (total - lo) / (next[0] - lo) : 1, toNext: next ? next[0] - total : 0 };
}

// Little sounds, made here: the frame can't load audio from the network.
function chime(notes) {
  if (muted) return;
  try {
    ctx ??= new AudioContext();
    if (ctx.state === "suspended") ctx.resume();
    notes.forEach(([f, t], k) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), at = ctx.currentTime + t;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.18, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.35);
      o.connect(g).connect(ctx.destination); o.start(at); o.stop(at + 0.4);
    });
  } catch {}
}
const tune = (n) => n >= 3 ? [[523, 0], [659, .1], [784, .2], [1047, .32]] : n === 2 ? [[523, 0], [659, .12], [784, .24]] : n === 1 ? [[523, 0], [587, .14]] : [[330, 0], [262, .16]];

function confetti() {
  const box = document.getElementById("confetti"), colors = ["var(--stamp)", "var(--gold)", "var(--sea)", "var(--sky)"];
  for (let k = 0; k < 40; k++) {
    const i = document.createElement("i");
    i.style.left = Math.random() * 100 + "%"; i.style.background = colors[k % 4];
    i.style.animationDelay = Math.random() * .4 + "s"; i.style.transform = `rotate(${Math.random() * 360}deg)`;
    box.append(i); setTimeout(() => i.remove(), 2200);
  }
}

function bar(s, sc) {
  return `<div class="bar">
    <div class="city display"><small>${esc(s.language)} · ${s.over ? "trip complete" : `stop ${esc(s.stop)} of ${esc(s.of)}`}</small>${esc(s.city)}</div>
    <span class="chip" id="starchip" title="Stars">★ ${sc.total}</span>
    <span class="chip combo" ${sc.combo < 2 ? "hidden" : ""} title="Three-star scenes in a row">🔥 ×${sc.combo}</span>
    <div class="rank"><b>${esc(sc.rank)} <span>${sc.next ? `· ${sc.toNext} ★ to ${esc(sc.next)}` : "· top rank"}</span></b><div class="meter"><i id="meter"></i></div></div>
  </div>`;
}

function route(s) {
  return `<nav class="route" aria-label="Your trip">${(s.trip ?? []).map((t, k) => {
    const now = !s.over && k + 1 === s.stop;
    return `<div class="stop ${t.done ? "done" : ""} ${now ? "now" : ""}" ${now ? 'aria-current="step"' : ""}>
      <div class="dot">${esc(t.icon || "📍")}</div><div class="st">${t.done ? stars(t.stars) : ""}</div><div class="name">${esc(t.place)}</div></div>`;
  }).join("")}</nav>`;
}

function result(l) {
  if (!l) return "";
  const word = ["Missed", "Not bad", "Nice!", "Perfect!"][l.stars] ?? "";
  const fixes = (l.fixes ?? []).map((f) => `<div class="fix"><div><s>${esc(f.said)}</s> → <b>${esc(f.better)}</b></div>${f.why ? `<span>${esc(f.why)}</span>` : ""}</div>`).join("");
  return `<section class="card result" id="result" aria-live="polite">
    <div class="stampmark"><div><div class="n">${esc(word)}</div><div class="stars">${stars(l.stars)}</div></div></div>
    <h3>${esc(l.place)}</h3>
    ${l.praise ? `<p>${esc(l.praise)}</p>` : ""}
    ${fixes || (l.stars ? `<div class="clean">No mistakes.</div>` : "")}
  </section>`;
}

function scene(s) {
  const c = s.scene, ch = c.character ?? {}, goals = [c.mission, ...(c.bonus ?? [])];
  return `<section class="card postcard" id="postcard">
      <div class="where"><span>${esc(c.icon || "📍")}</span><span>${esc(c.place)}</span>${c.kind === "lightning" ? `<span class="bolt">⚡ Lightning round</span>` : ""}</div>
      <div class="who"><div class="avatar" aria-hidden="true">${esc(ch.avatar || "🙂")}</div>
        <div><h2 class="display">${esc(ch.name)}</h2><div class="role">${esc(ch.role)}</div>${ch.mood ? `<span class="mood">${esc(ch.mood)}</span>` : ""}</div></div>
      <button class="bubble" id="bubble" aria-label="Opening line; press to show the English">
        <div class="line">${esc(c.opener)}</div>
        <div class="gloss ${glossOpen ? "" : "hide"}">${esc(c.opener_gloss)}</div>
        <small>${glossOpen ? "English shown" : "Tap for English"}</small>
      </button>
    </section>
    <section class="card ticket"><div class="side">MISSION</div><div>
      <ul>${goals.map((g, k) => `<li class="${k ? "bonus" : "main"}"><span class="s">☆</span><span>${k ? "<em>Bonus</em>" : ""}${esc(g)}</span></li>`).join("")}</ul>
      ${c.hint ? `<div class="hintline">💡 ${esc(c.hint)}</div>` : ""}
    </div></section>
    ${(c.phrases ?? []).length ? `<section class="kit"><h3>Phrase kit</h3><div class="phrases">${c.phrases.map((p, k) => {
      const open = peeked.has(k);
      return `<button class="phrase ${open ? "" : "locked"}" data-peek="${k}" aria-label="${open ? esc(p.t) : "Hidden phrase, press to show"}"><b>${esc(open ? p.t : "••••••••")}</b><span>${esc(open ? p.g : "•••••")}</span></button>`;
    }).join("")}</div></section>` : ""}
    <section class="controls">
      <form class="say" id="say"><input id="line" autocomplete="off" placeholder="Type your line in ${esc(s.language)}…" aria-label="Your line"><button class="btn go">Say it</button></form>
      <div class="row">
        <button class="btn" id="hint" ${s.hints > 0 ? "" : "disabled"}>💡 Hint <span class="bulbs">${"●".repeat(Math.max(0, s.hints ?? 0))}${"○".repeat(Math.max(0, 3 - (s.hints ?? 0)))}</span></button>
        <button class="btn" id="skip">Skip scene</button>
        <button class="btn" id="mute" aria-pressed="${muted}">${muted ? "🔇" : "🔊"}</button>
        <span class="tip">🎙️ Press <b>Talk</b> at the top and just speak.</span>
      </div>
    </section>`;
}

function passport(s, sc) {
  return `<section class="card passport">
    <div class="where" style="justify-content:center">Passport · ${esc(s.city)}</div>
    <h2 class="display">${esc(sc.rank)}</h2>
    <div class="big">★ ${sc.total} of ${(s.trip ?? []).length * 3} stars</div>
    <div class="stamps">${(s.trip ?? []).map((t, k) => `<div class="pstamp" style="animation-delay:${k * .18}s"><span class="ic">${esc(t.icon)}</span><span>${esc(t.place)}</span><span>${stars(t.stars)}</span></div>`).join("")}</div>
    ${(s.review ?? []).length ? `<div class="review"><h3>Take these home</h3>${s.review.map((r) => typeof r === "string" ? `<div class="fix"><b>${esc(r)}</b></div>`
      : `<div class="fix"><div><b>${esc(r.better ?? r.word)}</b>${r.said ? ` <s>${esc(r.said)}</s>` : ""}</div><span>${esc(r.why ?? r.meaning ?? "")}</span></div>`).join("")}</div>` : ""}
    <div class="row" style="justify-content:center"><button class="btn go" id="again">✈️ Another trip</button></div>
  </section>`;
}

function bank(s, fresh) {
  const w = s.words ?? [];
  if (!w.length) return "";
  return `<section class="card bank"><h3>Your phrasebook · ${w.length}</h3><div class="words">${w.map((x) =>
    `<span class="word ${fresh.has(x.word) ? "new" : ""}">${esc(x.word)} <i>${esc(x.meaning)}</i></span>`).join("")}</div></section>`;
}

function draw(s) {
  if (!s || !s.trip) return;
  const sc = score(s), p = prev, ps = p ? score(p) : null;
  const newStop = !p || p.stop !== s.stop || p.over !== s.over;
  const newResult = s.last && JSON.stringify(s.last) !== JSON.stringify(p?.last ?? null);
  if (newStop) { peeked.clear(); glossOpen = false; }
  const oldWords = new Set((p?.words ?? []).map((x) => x.word));
  const fresh = new Set(p ? (s.words ?? []).filter((x) => !oldWords.has(x.word)).map((x) => x.word) : []);

  // Keep a half-typed line across redraws.
  const typing = document.getElementById("line"), draft = typing?.value ?? "", focused = document.activeElement === typing;
  app.innerHTML = bar(s, sc) + route(s) + (s.over ? passport(s, sc) : result(s.last) + (s.scene ? scene(s) : "")) + bank(s, fresh);
  const line = document.getElementById("line");
  if (line && !newStop) { line.value = draft; if (focused) line.focus(); }

  const meter = document.getElementById("meter");
  meter.style.width = ((ps ? ps.pct : 0) * 100) + "%";
  requestAnimationFrame(() => requestAnimationFrame(() => { meter.style.width = sc.pct * 100 + "%"; }));
  if (newResult && p) {
    document.getElementById("result")?.classList.add("play");
    document.getElementById("starchip")?.classList.add("pop");
    chime(tune(s.last.stars));
    if (s.last.stars === 3) confetti();
  }
  if (newStop && p && !s.over) document.getElementById("postcard")?.classList.add("enter");
  if (s.over && !p?.over && p) { confetti(); setTimeout(confetti, 500); chime([[523, 0], [659, .12], [784, .24], [1047, .36], [1319, .5]]); }
  prev = s;
}

app.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  const s = snap.state;
  if (t.id === "bubble") { glossOpen = !glossOpen; draw(s); }
  else if (t.dataset.peek) { peeked.add(Number(t.dataset.peek)); chime([[880, 0]]); draw(s); }
  else if (t.id === "hint") snap.action("hint", { stop: s.stop });
  else if (t.id === "skip") snap.action("skip", { stop: s.stop });
  else if (t.id === "mute") { muted = !muted; draw(s); }
  else if (t.id === "again") snap.send("Let's go on another trip, somewhere new.");
});
app.addEventListener("submit", (e) => {
  e.preventDefault();
  const line = document.getElementById("line"), text = line.value.trim();
  if (!text) return;
  snap.send(text); line.value = "";
});
snap.onState((s) => draw(s));
</script>
</body>
</html>
